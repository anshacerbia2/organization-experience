name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The UI Platform's packages are vendored tarballs of one ui-platform CI run on main
  # (vendor/ui-platform/pin.json, TDD-organization-experience-001 §Visual Language "Intake"), the same
  # pin identity-experience builds on. Their digests match the pin, and each carries SLSA provenance
  # signed by ui-platform's CI workflow from the pinned commit on main.
  ui-platform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: verify the vendored ui-platform tarballs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ui-platform.mjs verify
  verify:
    runs-on: ubuntu-latest

    # The BFF's session store is tested against PostgreSQL: the row lock that keeps concurrent
    # refreshes to one, the expiry queries and the migrations are what is under test, and no fake
    # answers for them. Pinned by digest, the same server identity-control is verified against.
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: bff
          POSTGRES_PASSWORD: bff
          POSTGRES_DB: bff_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bff"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # The name is the identity BFF's: bff/test/support/database.ts reads it, and that file is
    # byte-identical to the source's (bff/conformance.json), so the name is kept rather than the file
    # changed.
    env:
      IDENTITY_EXPERIENCE_TEST_DATABASE_URL: postgres://bff:bff@localhost:5432/bff_test?sslmode=disable

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm

      # The lockfile is the dependency set. An install that would change it fails, so a dependency
      # moves only through a reviewed change (STD-GLB-FE-003 supply chain).
      - name: install
        run: pnpm install --frozen-lockfile

      - name: format
        run: pnpm format:check

      # The BFF is identity-experience's pattern without variation: every file bff/conformance.json
      # lists as identical is compared byte for byte with the source at its pinned commit, and every
      # other file under bff/ must be listed as adapted, with why.
      - name: bff conformance
        run: pnpm check:bff-conformance

      # The Organization Control API's specification the client is contract-tested against
      # (contracts/, ADR-GLB-010 §5.1) is organization-control's published api/openapi.yaml at the
      # commit contracts/organization-control/pin.json names, byte for byte. The contract tests run
      # with the rest under test.
      - name: api contract
        run: pnpm check:api-contract

      - name: typecheck
        run: pnpm typecheck

      # ESLint, stylelint in every package, and the module boundaries of each application.
      - name: lint
        run: pnpm lint

      - name: test
        run: pnpm test:scripts && pnpm test

      # The build ends with scripts/check-dist.mjs: no inline script or style, no data: stylesheet
      # or font, and no credential-shaped string in the bundle.
      - name: build
        run: pnpm build

      - name: dependency audit
        run: pnpm audit --prod --audit-level high

  # The fixture-backed browser tests (e2e/browser, TDD-organization-experience-001 §Visual Language):
  # Chromium against the built application, served with the BFF's security headers, every read
  # answered by fixtures. Every main route, signed in, with data, in Tenant scope and in provider mode,
  # light and dark, desktop and tablet: a screenshot each, kept as the browser-screens artifact, and
  # axe with layout and computed style. Automated evidence only: the manual WCAG 2.2 AA audit is not
  # replaced by it.
  browser:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: build the application
        run: pnpm --filter @organization-experience/admin build

      # Playwright's own command, Chromium alone and its system dependencies, not cached
      # (STD-GLB-FE-008 §3.4).
      - name: Chromium for the browser tests
        run: pnpm --filter @organization-experience/e2e exec playwright install --with-deps chromium

      - name: browser tests
        run: pnpm test:browser

      - name: keep the screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-screens
          path: e2e/browser-results/screens/
          if-no-files-found: ignore
          retention-days: 30

      - name: keep the browser test report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-report
          path: |
            e2e/browser-results/report/
            e2e/browser-results/tests/
          if-no-files-found: ignore
          retention-days: 14
